[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-support-orchestrator"
version = "0.1.0"
description = "A modular LangGraph foundation for a customer support orchestrator."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph",
    "langchain-community",
    "langchain-text-splitters",
    "langchain-openai",
    "langchain-chroma",
    "chromadb",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
